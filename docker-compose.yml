version: '3.8'

services:
  vdb-converter:
    platform: linux/amd64
    build: .
    image: smoke-sim-vdb-converter
    container_name: npz-to-vdb-converter
    volumes:
      # Mount the entire results directory (allows writing to subdirectories)
      - ./results:/app/results
    environment:
      # Optional: customize field name (default: density)
      - FIELD_NAME=density

